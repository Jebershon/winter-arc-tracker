<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17192d"/>
      <stop offset="1" stop-color="#39306b"/>
    </linearGradient>
    <!-- One arm pointing up from the centre, with two pairs of side branches -->
    <g id="arm" fill="none" stroke="#a69cff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
      <path d="M256 256 L256 136"/>
      <path d="M256 190 L236 170 M256 190 L276 170"/>
      <path d="M256 158 L244 146 M256 158 L268 146"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <use xlink:href="#arm" href="#arm"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(60 256 256)"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(120 256 256)"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(180 256 256)"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(240 256 256)"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(300 256 256)"/>
</svg>
